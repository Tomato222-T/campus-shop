<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园好物商城 · 数据看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray: #6b7280;
      --border: #e5e7eb;
      --bg: #f5f6fa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: #111827;
      padding-bottom: 40px;
    }
    a { color: inherit; text-decoration: none; }

    .dash-header {
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }
    .dash-header h1 { font-size: 18px; font-weight: 700; }
    .dash-header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; }
    .btn-link {
      background: rgba(255,255,255,0.18); color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .btn-link:hover { background: rgba(255,255,255,0.3); }

    .container { max-width: 1100px; margin: 0 auto; padding: 16px 20px; }

    /* 指标卡 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .kpi-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .kpi-label { font-size: 13px; color: var(--gray); margin-bottom: 8px; }
    .kpi-value { font-size: 26px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 11px; color: var(--gray); margin-top: 4px; }
    .kpi-card.success .kpi-value { color: var(--success); }
    .kpi-card.warning .kpi-value { color: var(--warning); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }

    .card {
      background: #fff; border-radius: 12px; padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

    /* 条形图 */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { width: 110px; font-size: 13px; text-align: right; color: #374151; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; background: #f3f4f6; border-radius: 6px; height: 22px; position: relative; overflow: hidden; }
    .bar-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 8px; color: #fff; font-size: 12px; font-weight: 600;
      min-width: 2px;
    }
    .bar-rank {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .bar-rank.top1 { background: #fef3c7; color: #92400e; }
    .bar-rank.top2 { background: #e0e7ff; color: #3730a3; }
    .bar-rank.top3 { background: #fee2e2; color: #991b1b; }

    /* 状态分布 */
    .status-list { display: flex; flex-direction: column; gap: 10px; }
    .status-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .status-name { width: 70px; color: #374151; }
    .status-bar { flex: 1; background: #f3f4f6; border-radius: 6px; height: 18px; overflow: hidden; }
    .status-bar > div { height: 100%; border-radius: 6px; }
    .status-count { width: 40px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* 经营建议 */
    .advice-list { display: flex; flex-direction: column; gap: 10px; }
    .advice-item {
      display: flex; gap: 10px; padding: 10px 12px;
      border-radius: 8px; font-size: 13px; line-height: 1.5;
      border: 1px solid var(--border); background: #fafafa;
    }
    .advice-icon { font-size: 18px; flex-shrink: 0; }
    .advice-item.tip { border-color: #fde68a; background: #fffbeb; }
    .advice-item.warn { border-color: #fecaca; background: #fef2f2; }
    .advice-item.good { border-color: #a7f3d0; background: #ecfdf5; }
    .advice-empty { color: var(--gray); font-size: 13px; text-align: center; padding: 20px; }
  </style>
</head>

    // ===================== 工具函数 =====================
    function formatPrice(p) { return Number(Number(p).toFixed(2)).toString(); }
    function getOrders() {
      try {
        const list = JSON.parse(localStorage.getItem(ORDER_KEY));
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    }
    function loadInventory() {
      try {
        const saved = JSON.parse(localStorage.getItem(STOCK_KEY));
        if (!saved || typeof saved !== "object" || Array.isArray(saved)) return;
        PRODUCTS.forEach(p => p.skus.forEach((sku, i) => {
          const s = Number(saved[`${p.id}-${i}`]);
          if (Number.isInteger(s) && s >= 0) sku.stock = s;
        }));
      } catch (e) {}
    }

    // ===================== 计算指标 =====================
    function computeMetrics() {
      const orders = getOrders();
      const doneOrders = orders.filter(o => DONE_STATUSES.includes(o.status));

      const gmv = doneOrders.reduce((sum, o) => sum + ((o.amounts && o.amounts.total) || 0), 0);
      const orderCount = doneOrders.length;
      const avgPrice = orderCount > 0 ? gmv / orderCount : 0;

      // 状态分布
      const statusCount = { pending: 0, paid: 0, shipped: 0, done: 0, cancelled: 0 };
      orders.forEach(o => { if (statusCount[o.status] != null) statusCount[o.status]++; });

      // 销量 TOP5：聚合成交订单中每个商品的件数
      const salesMap = {};
      doneOrders.forEach(o => {
        (o.items || []).forEach(it => {
          const key = `${it.productId}`;
          if (!salesMap[key]) salesMap[key] = { name: it.name, emoji: it.emoji || "📦", qty: 0 };
          salesMap[key].qty += it.quantity;
        });
      });
      const top5 = Object.values(salesMap).sort((a, b) => b.qty - a.qty).slice(0, 5);
      const maxQty = top5.length ? top5[0].qty : 1;

      // 已售件数（成交订单总件数）
      const soldPieces = doneOrders.reduce((s, o) => s + (o.items || []).reduce((a, i) => a + i.quantity, 0), 0);

      return { orders, doneOrders, gmv, orderCount, avgPrice, statusCount, top5, maxQty, soldPieces };
    }

    // ===================== 渲染 =====================

          <div class="kpi-sub">已支付/配送中/已完成订单实付合计</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">📦 成交订单数</div>
          <div class="kpi-value">${m.orderCount}</div>
          <div class="kpi-sub">总订单 ${m.orders.length} 单</div>
        </div>
        <div class="kpi-card warning">
          <div class="kpi-label">🧮 客单价</div>
          <div class="kpi-value">¥${formatPrice(m.avgPrice)}</div>
          <div class="kpi-sub">GMV ÷ 成交订单数</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">🛒 已售件数</div>
          <div class="kpi-value">${m.soldPieces}</div>
          <div class="kpi-sub">成交订单商品总件数</div>
        </div>
      `;
      document.getElementById("kpiGrid").innerHTML = html;
    }

    function renderTop5(m) {
      const el = document.getElementById("top5");
      if (m.top5.length === 0) {
        el.innerHTML = '<div class="advice-empty">暂无成交数据，去店铺端下单试试吧～</div>';
        return;
      }
      el.innerHTML = m.top5.map((item, idx) => {
        const pct = Math.max(4, Math.round((item.qty / m.maxQty) * 100));
        const rankClass = idx === 0 ? "top1" : idx === 1 ? "top2" : idx === 2 ? "top3" : "";
        return `
          <div class="bar-row">
            <div class="bar-rank ${rankClass}">${idx + 1}</div>
            <div class="bar-label">${item.emoji} ${item.name}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%">${item.qty} 件</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderStatusDist(m) {
      const total = m.orders.length || 1;
      const config = [
        { key: "pending",   label: "待支付", color: "#f59e0b" },
        { key: "paid",      label: "待发货", color: "#3b82f6" },
        { key: "shipped",   label: "配送中", color: "#6366f1" },
        { key: "done",      label: "已完成", color: "#10b981" },
        { key: "cancelled", label: "已取消", color: "#9ca3af" }
      ];
      document.getElementById("statusDist").innerHTML = `
        <div class="status-list">
          ${config.map(c => {
            const n = m.statusCount[c.key];
            const pct = Math.round((n / total) * 100);
            return `
              <div class="status-item">
                <span class="status-dot" style="background:${c.color}"></span>
                <span class="status-name">${c.label}</span>
                <div class="status-bar"><div style="width:${pct}%;background:${c.color}"></div></div>
                <span class="status-count">${n}</span>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    // ===================== 自动经营建议（规则引擎）=====================
    function buildAdvice(m) {
      const list = [];
      const now = Date.now();
      const DAY = 24 * 60 * 60 * 1000;

      // 1. 待发货提醒
      if (m.statusCount.paid > 0) {
        list.push({ type: "warn", icon: "🚚", text: `有 ${m.statusCount.paid} 笔订单待发货，请尽快在「订单管理」中点击发货，避免影响买家体验。` });
      }
      // 2. 待支付超时催付（超过 24 小时）
      const overduePending = m.orders.filter(o =>
        o.status === "pending" && (now - new Date(o.createdAt).getTime()) > DAY
      );
      if (overduePending.length > 0) {
        list.push({ type: "tip", icon: "⏰", text: `有 ${overduePending.length} 笔待支付订单已超过 24 小时，建议主动联系买家催付或取消以释放库存。` });
      }
      // 3. 库存不足告警（任意 SKU 库存 ≤ 5）
      const lowStock = [];
      PRODUCTS.forEach(p => p.skus.forEach((sku, i) => {
        if (sku.stock <= 5) {
          const spec = p.specs.map((s, idx) => `${s.name}:${sku.values[idx]}`).join("/");
          lowStock.push(`${p.name}（${spec}）仅剩 ${sku.stock}`);
        }
      }));
      if (lowStock.length > 0) {
        list.push({ type: "warn", icon: "⚠️", text: `以下规格库存告急（≤5）：${lowStock.slice(0, 5).join("；")}${lowStock.length > 5 ? " 等" : ""}，建议尽快补货。` });
      }
      // 4. 断货告警
      const outStock = [];
      PRODUCTS.forEach(p => p.skus.forEach((sku, i) => {
        if (sku.stock === 0) {
          const spec = p.specs.map((s, idx) => `${s.name}:${sku.values[idx]}`).join("/");
          outStock.push(`${p.name}（${spec}）`);
        }
      }));
      if (outStock.length > 0) {
        list.push({ type: "warn", icon: "🚫", text: `以下规格已断货：${outStock.slice(0, 5).join("；")}，可在后台临时下架或紧急补货。` });
      }
      // 5. 销量冠军 → 主推建议
      if (m.top5.length > 0) {
        const champ = m.top5[0];
        list.push({ type: "good", icon: "🏆", text: `「${champ.name}」销量第一（${champ.qty} 件），建议在首页置顶主推，并确保库存充足。` });
      }
      // 6. 取消率分析
      if (m.orders.length >= 5) {
        const cancelRate = m.statusCount.cancelled / m.orders.length;
        if (cancelRate >= 0.3) {
          list.push({ type: "warn", icon: "📉", text: `订单取消率达 ${(cancelRate * 100).toFixed(0)}%，偏高。建议检查商品描述/价格是否准确，或跟进取消原因。` });
        }
      }
      // 7. 客单价偏低建议
      if (m.orderCount >= 3 && m.avgPrice > 0 && m.avgPrice < 40) {
        list.push({ type: "tip", icon: "💡", text: `当前客单价 ¥${formatPrice(m.avgPrice)} 偏低，可考虑设置满减优惠券（如满59减5）或搭配组合装提升客单价。` });
      }
      // 8. 没有数据
      if (list.length === 0) {
        list.push({ type: "good", icon: "✅", text: "经营状况良好，暂无需要处理的事项。继续保持～" });
      }
      return list;
    }

    function renderAdvice(m) {
      const list = buildAdvice(m);
      document.getElementById("advice").innerHTML = list.map(a =>
        `<div class="advice-item ${a.type}"><span class="advice-icon">${a.icon}</span><span>${a.text}</span></div>`
      ).join("");
    }

    // ===================== 初始化 =====================
    loadInventory();
    const metrics = computeMetrics();
    renderKPI(metrics);
    renderTop5(metrics);
    renderStatusDist(metrics);
    renderAdvice(metrics);
  </script>
</body>
</html>
